<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="canonical" href="https://hawaiioman.com/" />
  <meta name="theme-color" content="#F26431" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Hawaii Fresh Juice | Taste Oman in Every Sip</title>
  <meta name="description"
    content="Authentic Omani freshness in every bottle. Hawaii Fresh Juice offers 100% natural, farm-to-bottle juices from carefully selected local fruits. Taste the bounty of Oman." />
  <meta name="keywords"
    content="Hawaii Fresh Juice, Oman juice, fresh juice Oman, Omani natural juice, farm to bottle, healthy juice, Omani fruits" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hawaii Fresh Juice | Taste Oman in Every Sip" />
  <meta property="og:description"
    content="100% natural, farm-to-bottle juices from the heart of Oman. Pure freshness, every time." />
  <meta property="og:image" content="https://hawaiioman.com/assets/og-image.jpg" />
  <meta property="og:url" content="https://hawaiioman.com" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Hawaii Fresh Juice | Taste Oman" />
  <meta name="twitter:description" content="100% natural juices from the heart of Oman." />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Hawaii Fresh Juice",
      "description": "Authentic Omani freshness in every bottle.",
      "url": "https://hawaiioman.com",
      "logo": "https://hawaiioman.com/favicon.png",
      "areaServed": "Oman",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Fresh Juices",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Product",
              "name": "Omani Fresh Juices"
            }
          }
        ]
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Recoleta:wght@700&family=Work+Sans:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
