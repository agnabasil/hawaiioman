<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />

  <!-- Security hardening (defense-in-depth; GitHub Pages can't set HTTP headers) -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; form-action 'self' https://script.google.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#F26431" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="format-detection" content="telephone=no" />

  <!-- title, description, robots, canonical, Open Graph and Twitter tags are set
       per-page by react-helmet-async (SEOHead). Kept out of this static template
       to avoid duplicate tags in the prerendered HTML. -->
  <meta name="keywords"
    content="Hawaii Fresh Juice, Oman juice, fresh juice Oman, Omani natural juice, farm to bottle, healthy juice, Omani fruits, organic juice Muscat, best juice in Oman" />
  <meta name="author" content="Hawaii Fresh Juice" />
  <meta name="publisher" content="Hawaii Fresh Juice" />
  <!-- canonical + hreflang set per-page by react-helmet-async (SEOHead) -->

  <!-- Geo targeting (local SEO — Muscat, Oman) -->
  <meta name="geo.region" content="OM-MA" />
  <meta name="geo.placename" content="Muscat" />
  <meta name="geo.position" content="23.5859;58.4059" />
  <meta name="ICBM" content="23.5859, 58.4059" />

  <!-- Linked entity graph (@id cross-refs) — knowledge graph + LLM/AI-search entity resolution -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://hawaiioman.com/#organization",
          "name": "Hawaii Fresh Juice",
          "alternateName": ["Hawaii Juices", "Hawaii Oman", "Hawaii Fresh Juice Oman", "Hawaiioman"],
          "url": "https://hawaiioman.com",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://hawaiioman.com/#logo",
            "url": "https://hawaiioman.com/images/hawaii-logo.png",
            "contentUrl": "https://hawaiioman.com/images/hawaii-logo.png",
            "width": 400,
            "height": 120,
            "caption": "Hawaii Fresh Juice"
          },
          "image": { "@id": "https://hawaiioman.com/#logo" },
          "description": "Authentic Omani freshness in every bottle. 100% natural, farm-to-bottle juices from carefully selected local fruits.",
          "foundingDate": "2024-03",
          "slogan": "Taste Oman in every sip",
          "knowsAbout": ["Fresh fruit juice", "Organic beverages", "Omani food and drink", "Farm-to-bottle production"],
          "founder": {
            "@type": "Person",
            "@id": "https://hawaiioman.com/#founder",
            "name": "Yasir Arafath",
            "jobTitle": "CEO & Founder",
            "worksFor": { "@id": "https://hawaiioman.com/#organization" }
          },
          "areaServed": { "@type": "Country", "name": "Oman" },
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Al Wadi Al Kabir",
            "addressLocality": "Muscat",
            "addressRegion": "Muscat Governorate",
            "postalCode": "117",
            "addressCountry": "OM"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+968-7972-7401",
            "email": "jannajuices@gmail.com",
            "contactType": "customer service",
            "availableLanguage": ["English", "Arabic"]
          }
        },
        {
          "@type": ["LocalBusiness", "FoodEstablishment"],
          "@id": "https://hawaiioman.com/#localbusiness",
          "name": "Hawaii Fresh Juice",
          "parentOrganization": { "@id": "https://hawaiioman.com/#organization" },
          "description": "100% natural, farm-to-bottle fruit juices from Oman.",
          "url": "https://hawaiioman.com",
          "logo": { "@id": "https://hawaiioman.com/#logo" },
          "image": "https://hawaiioman.com/assets/og-image.jpg",
          "telephone": "+968-7972-7401",
          "email": "jannajuices@gmail.com",
          "servesCuisine": "Fresh juice",
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 23.5859,
            "longitude": 58.4059
          },
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Al Wadi Al Kabir",
            "addressLocality": "Muscat",
            "addressRegion": "Muscat Governorate",
            "postalCode": "117",
            "addressCountry": "OM"
          },
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Saturday", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"],
              "opens": "08:00",
              "closes": "18:00"
            }
          ],
          "priceRange": "$$",
          "currenciesAccepted": "OMR"
        },
        {
          "@type": "WebSite",
          "@id": "https://hawaiioman.com/#website",
          "name": "Hawaii Fresh Juice",
          "url": "https://hawaiioman.com",
          "inLanguage": "en",
          "publisher": { "@id": "https://hawaiioman.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://hawaiioman.com/products?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
  </script>

  <!-- LCP: preload hero image (Core Web Vitals) -->
  <link rel="preload" as="image" href="/images/hero-orange-juice.png" fetchpriority="high" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Recoleta:wght@700&family=Work+Sans:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
</head>

</html>
