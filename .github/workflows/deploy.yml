name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # react-router 8 requires node >=22.22.0
          node-version: 22
          cache: 'npm'
      - name: Install Chrome for prerendering
        # Third-party action pinned to a commit SHA (v1 tag = c785b87, 2025-11-14):
        # a mutable tag lets the publisher (or anyone who compromises the repo)
        # change what runs in this workflow after review.
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
      - name: Install dependencies
        # npm ci installs exactly the audited tree in package-lock.json.
        # npm install re-resolves semver ranges, so a dependency published
        # after the lockfile was audited could land in a production build.
        run: npm ci
      - name: Build with prerendering
        run: npm run build
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
      - name: Create 404.html for SPA routing
        run: cp dist/index.html dist/404.html
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
